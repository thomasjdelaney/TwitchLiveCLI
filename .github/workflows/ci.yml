name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - if: runner.os == 'Windows'
        name: Run tests (Windows, with diagnostics)
        run: go test -json -count=1 -timeout=4m ./...
        env:
          GODEBUG: inittrace=1
      - if: runner.os != 'Windows'
        run: go test ./...
      - run: go build -buildvcs=false ./...

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build
        shell: bash
        run: |
          ext=''
          if [ '${{ matrix.goos }}' = windows ]; then ext='.exe'; fi
          name="twitch-live-cli_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' go build -buildvcs=false -trimpath -ldflags='-s -w' -o "$name" .
          tar -czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: twitch-live-cli_*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
